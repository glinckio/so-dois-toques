name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  qualidade:
    name: Lint, tipos e testes de unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:specs

  dependencias:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Bloqueia vulnerabilidade alta em dependências que vão para produção.
      - run: pnpm audit --prod --audit-level high
      # Ferramentas de desenvolvimento: relatório sem bloquear.
      - run: pnpm audit --audit-level high || true

  integracao:
    name: Testes de integração da API (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdt
          POSTGRES_PASSWORD: sdt_ci
          POSTGRES_DB: so_dois_toques
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdt -d so_dois_toques"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sdt:sdt_ci@localhost:5432/so_dois_toques
      WEB_ORIGIN: http://localhost:3000
      # Valor fixo só para o CI; o banco de teste é recriado a cada execução.
      INTERNAL_API_KEY: ci-chave-interna-apenas-para-testes-automatizados
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pg_dump e pg_restore para os testes de backup (LANC-CA-04 a 06).
      - run: sudo apt-get install -y --no-install-recommends postgresql-client && pg_dump --version
      # O setup dos testes recria o banco so_dois_toques_test e aplica as migrations.
      - run: pnpm test:integration

  e2e:
    name: Ponta a ponta e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdt
          POSTGRES_PASSWORD: sdt_ci
          POSTGRES_DB: so_dois_toques
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdt -d so_dois_toques"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # O Playwright sobe a API com o banco so_dois_toques_e2e, recriado a cada execução.
      DATABASE_URL: postgresql://sdt:sdt_ci@localhost:5432/so_dois_toques
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sdt/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
